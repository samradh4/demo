<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Fifty 1 International — WhatsApp AI Demo</title>
<style>
  :root{
    --wa:#0b141a; --panel:#202c33; --panel2:#111b21; --bubble:#005c4b;
    --bubble2:#202c33; --text:#e9edef; --muted:#8696a0; --green:#00a884;
    --line:#2a3942; --chip:#233138;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0b141a;color:var(--text)}
  body{
    display:grid;place-items:center;
    background:
      radial-gradient(circle at 15% 10%, rgba(0,168,132,.18), transparent 26%),
      radial-gradient(circle at 85% 90%, rgba(0,92,75,.18), transparent 28%),
      #071014;
  }
  .phone{
    width:min(430px,100vw); height:min(900px,100dvh);
    background:var(--wa); overflow:hidden; position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
    border:1px solid #1d2a30;
    display:flex; flex-direction:column;
  }
  @media(min-width:600px){
    .phone{border-radius:28px;height:min(860px,94vh)}
  }
  .top{
    height:74px; min-height:74px; background:var(--panel);
    display:flex;align-items:center;padding:10px 12px;gap:10px;border-bottom:1px solid rgba(255,255,255,.04);
  }
  .back{font-size:28px;color:#d9e2e6;line-height:1;transform:translateY(-1px)}
  .avatar{
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(145deg,#111,#2a2112);
    border:1px solid #3b2c10; color:#d8b65d; font-weight:800; font-size:15px;
    letter-spacing:.2px;position:relative;
  }
  .avatar:after{content:"51";font-size:17px}
  .headtxt{min-width:0;flex:1}
  .title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .verified{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#1da1f2;color:white;font-size:10px;margin-left:4px;vertical-align:1px}
  .sub{font-size:12.5px;color:#aebac1;margin-top:2px}
  .icons{display:flex;gap:18px;color:#dce4e8;font-size:21px;align-items:center}
  .chat{
    flex:1; overflow:auto; padding:18px 12px 118px;
    background-color:#0b141a;
    background-image:
      radial-gradient(circle at 25px 25px, rgba(255,255,255,.025) 2px, transparent 2.6px),
      radial-gradient(circle at 65px 55px, rgba(255,255,255,.02) 1.8px, transparent 2.4px);
    background-size:90px 90px;
    scroll-behavior:smooth;
  }
  .date{width:max-content;margin:0 auto 16px;background:#182229;color:#8696a0;padding:6px 11px;border-radius:8px;font-size:11px}
  .bubble{
    max-width:85%;padding:8px 9px 6px;border-radius:8px;margin:6px 0;line-height:1.35;font-size:14px;position:relative;
    box-shadow:0 1px 1px rgba(0,0,0,.15);
  }
  .in{background:var(--bubble2);border-top-left-radius:2px}
  .out{background:var(--bubble);margin-left:auto;border-top-right-radius:2px}
  .time{display:block;text-align:right;font-size:10.5px;color:#9fb2ba;margin-top:3px}
  .out .time{color:#b5d8d1}
  .typing{display:inline-flex;gap:4px;align-items:center;height:17px}
  .typing i{width:5px;height:5px;background:#9aa8ae;border-radius:50%;animation:b 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .choices{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 8px}
  .choice{
    border:1px solid #2b6f63;background:#13251f;color:#cfeee7;border-radius:999px;padding:9px 11px;
    font-size:12.5px;cursor:pointer;user-select:none;transition:.15s;
  }
  .choice:active{transform:scale(.98)}
  .card{
    background:#17242a;border:1px solid #263841;border-radius:10px;overflow:hidden;margin-top:8px;
  }
  .cardTop{height:110px;background:linear-gradient(135deg,#303c42,#111c20);display:flex;align-items:flex-end;padding:12px}
  .cardTop b{font-size:18px}
  .cardBody{padding:10px}
  .spec{display:flex;gap:10px;flex-wrap:wrap;color:#b8c5ca;font-size:12px;margin-top:4px}
  .cta{
    width:100%;margin-top:10px;border:0;border-top:1px solid #28433c;background:transparent;color:#51c7ad;padding:10px;font-weight:700;cursor:pointer
  }
  .composerWrap{
    position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(11,20,26,.94) 20%,#0b141a 55%);
    padding:24px 8px calc(8px + env(safe-area-inset-bottom));
  }
  .composer{display:flex;align-items:flex-end;gap:7px}
  .inputbox{
    flex:1;background:var(--panel);border-radius:23px;display:flex;align-items:flex-end;padding:9px 10px;gap:8px;min-height:46px
  }
  #msg{flex:1;outline:none;border:0;background:transparent;color:var(--text);font:inherit;resize:none;max-height:100px;line-height:1.4;padding:4px 0}
  #msg::placeholder{color:#85969f}
  .send{
    width:46px;height:46px;border-radius:50%;border:0;background:var(--green);color:white;font-size:20px;display:grid;place-items:center;cursor:pointer
  }
  .mini{color:#9fb0b7;font-size:20px}
  .demoTag{
    position:absolute;right:10px;top:82px;z-index:3;background:rgba(8,18,22,.72);backdrop-filter:blur(7px);
    border:1px solid rgba(255,255,255,.08);color:#93a4ab;font-size:10px;padding:5px 7px;border-radius:999px
  }
</style>
</head>
<body>
  <main class="phone">
    <div class="top">
      <div class="back">‹</div>
      <div class="avatar"></div>
      <div class="headtxt">
        <div class="title">Fifty 1 International <span class="verified">✓</span></div>
        <div class="sub">Luxury Real Estate Assistant</div>
      </div>
      <div class="icons"><span>⌕</span><span>⋮</span></div>
    </div>

    <div class="demoTag">INTERACTIVE DEMO</div>

    <section class="chat" id="chat">
      <div class="date">TODAY</div>
      <div class="bubble in">
        Welcome to <b>Fifty 1 International</b> 👋<br><br>
        I can help you discover premium properties, share project details & brochures, shortlist by budget/location, and arrange a private viewing.
        <span class="time">16:05</span>
      </div>
      <div class="bubble in">
        What would you like to do?
        <div class="choices">
          <button class="choice" onclick="pick('Explore luxury properties')">🏙️ Explore properties</button>
          <button class="choice" onclick="pick('I want options by budget')">💰 Search by budget</button>
          <button class="choice" onclick="pick('Send me brochures')">📄 Get brochures</button>
          <button class="choice" onclick="pick('Book a private viewing')">📅 Book viewing</button>
        </div>
        <span class="time">16:05</span>
      </div>
    </section>

    <div class="composerWrap">
      <div class="composer">
        <div class="inputbox">
          <span class="mini">☺</span>
          <textarea id="msg" rows="1" placeholder="Type a message"></textarea>
          <span class="mini">⌕</span>
        </div>
        <button class="send" id="send">➤</button>
      </div>
    </div>
  </main>

<script>
const chat = document.getElementById('chat');
const msg = document.getElementById('msg');
const send = document.getElementById('send');

const timeNow = () => new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

function addBubble(text, side='in', html=false){
  const d=document.createElement('div');
  d.className='bubble '+side;
  d.innerHTML=(html?text:escapeHtml(text))+`<span class="time">${timeNow()}</span>`;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  return d;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function typingThen(fn, delay=650){
  const t=document.createElement('div'); t.className='bubble in';
  t.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
  chat.appendChild(t); chat.scrollTop=chat.scrollHeight;
  setTimeout(()=>{t.remove();fn();},delay);
}

function pick(text){
  addBubble(text,'out');
  typingThen(()=>respond(text));
}

function propertyCard(){
  return `
  <div>Based on a premium-buyer profile, here’s a sample match:</div>
  <div class="card">
    <div class="cardTop"><b>Signature Residence · Gurgaon</b></div>
    <div class="cardBody">
      <b>Ultra-luxury 4 BHK</b>
      <div class="spec"><span>📍 Golf Course Extn.</span><span>📐 3,000+ sq.ft.</span><span>✨ Premium amenities</span></div>
      <button class="cta" onclick="pick('Send brochure for this property')">VIEW / REQUEST BROCHURE</button>
    </div>
  </div>`;
}

function askBudget(){
  return `Absolutely. What budget range should I work with?
  <div class="choices">
    <button class="choice" onclick="pick('Budget 2 to 4 crore')">₹2–4 Cr</button>
    <button class="choice" onclick="pick('Budget 4 to 8 crore')">₹4–8 Cr</button>
    <button class="choice" onclick="pick('Budget above 8 crore')">₹8 Cr+</button>
    <button class="choice" onclick="pick('I have a custom budget')">Custom</button>
  </div>`;
}
function askLocation(){
  return `Great. Which location interests you?
  <div class="choices">
    <button class="choice" onclick="pick('Golf Course Road')">Golf Course Road</button>
    <button class="choice" onclick="pick('Golf Course Extension Road')">Golf Course Extn.</button>
    <button class="choice" onclick="pick('Dwarka Expressway')">Dwarka Expressway</button>
    <button class="choice" onclick="pick('I am open to recommendations')">Open to suggestions</button>
  </div>`;
}
function booking(){
  return `I can arrange a private viewing. Please choose a preferred slot:
  <div class="choices">
    <button class="choice" onclick="pick('Tomorrow morning')">Tomorrow · Morning</button>
    <button class="choice" onclick="pick('Tomorrow evening')">Tomorrow · Evening</button>
    <button class="choice" onclick="pick('This weekend')">This weekend</button>
  </div>`;
}

function respond(text){
  const x=text.toLowerCase();
  if(x.includes('explore') || x.includes('property') || x.includes('properties')){
    addBubble(askLocation(),'in',true);
  } else if(x.includes('budget') || x.match(/\b(cr|crore|lakh)\b/)){
    if(x.match(/\d/) || x.includes('above')){
      addBubble(`Perfect — I’ll shortlist only relevant premium options so you don’t have to go through dozens of listings.<br><br>${propertyCard()}`,'in',true);
    }else addBubble(askBudget(),'in',true);
  } else if(x.includes('golf') || x.includes('dwarka') || x.includes('suggest')){
    addBubble(askBudget(),'in',true);
  } else if(x.includes('brochure')){
    addBubble(`Sure. I can instantly share the brochure, floor plan and key project details here.<br><br>For the live setup, the actual PDF/brochure can be sent automatically based on the project selected.<div class="choices"><button class="choice" onclick="pick('I want to talk to an advisor')">Talk to advisor</button><button class="choice" onclick="pick('Book a private viewing')">Book viewing</button></div>`,'in',true);
  } else if(x.includes('viewing') || x.includes('visit')){
    addBubble(booking(),'in',true);
  } else if(x.includes('tomorrow') || x.includes('weekend') || x.includes('morning') || x.includes('evening')){
    addBubble(`Done — I’ve captured your preferred slot: <b>${escapeHtml(text)}</b>.<br><br>In the live version, this lead can be sent straight to your sales team with the buyer’s name, budget, location preference and requested time.<div class="choices"><button class="choice" onclick="pick('I want to talk to an advisor')">Connect me to advisor</button></div>`,'in',true);
  } else if(x.includes('advisor') || x.includes('human') || x.includes('agent')){
    addBubble(`Of course. Please share your <b>name</b> and best contact number. A Fifty 1 International advisor can take over with the full conversation context — no need to repeat your requirements.`,'in',true);
  } else {
    addBubble(`I can help with property discovery, budgets, project brochures and private-viewing bookings.<div class="choices"><button class="choice" onclick="pick('Explore luxury properties')">Explore properties</button><button class="choice" onclick="pick('I want options by budget')">Search by budget</button><button class="choice" onclick="pick('Book a private viewing')">Book viewing</button></div>`,'in',true);
  }
}

function submit(){
  const v=msg.value.trim(); if(!v)return;
  addBubble(v,'out'); msg.value=''; msg.style.height='auto';
  typingThen(()=>respond(v));
}
send.addEventListener('click',submit);
msg.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();}});
msg.addEventListener('input',()=>{msg.style.height='auto';msg.style.height=Math.min(msg.scrollHeight,100)+'px';});
</script>
</body>
</html>
